# SPDX-License-Identifier: GPL-3.0-or-later
# พัสดุเวนิช (VENIT SUPPLY) for Windows: tests → PyInstaller bundle → self-test → Thai installer.
# Runs on a push that changes venitsupply/ (test build, artifact only), from the Actions tab,
# or on a tag venitsupply-v2026.11.13.3. A GitHub Release is published only on a tag or when
# "release" is ticked — never on a plain push.
name: venitsupply-windows

on:
  push:
    branches: ["claude/**"]
    paths: ["venitsupply/**", ".github/workflows/venitsupply-windows.yml"]
    tags: ["venitsupply-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown by the installer (e.g. 2026.11.13.3)"
        required: false
        default: ""
      release:
        description: "Publish a GitHub Release with the installer"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: VENIT SUPPLY installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: venitsupply
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/venitsupply-v* ]]; then V="${GITHUB_REF#refs/tags/venitsupply-v}"
          elif [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"
          else V="$(python -c "import venitsupply; print(venitsupply.__version__)")"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: PyInstaller bundle
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/venitsupply.spec

      - name: Self-test of the bundle
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\venitsupply\venitsupply.exe" -ArgumentList "--selftest", "$env:RUNNER_TEMP\vs-selftest" -Wait -PassThru
          Get-ChildItem "$env:RUNNER_TEMP\vs-selftest"
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\vs-selftest\selftest-ok.txt")) {
            Write-Host "::error::self-test failed (exit $($p.ExitCode))"; exit 1 }
          $mb = [math]::Round(((Get-ChildItem dist\venitsupply -Recurse -File | Measure-Object Length -Sum).Sum / 1MB))
          Write-Host "bundle size: $mb MB"

      - name: Inno Setup 6.5+ (Thai)
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress

      - name: Installer
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                   Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending)[0].FullName
          $out = & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\venitsupply.iss 2>&1
          $code = $LASTEXITCODE
          $out | Where-Object { "$_" -notmatch 'Compressing:' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { $out | Select-Object -Last 8 | ForEach-Object { Write-Host "::error::$_" }; exit $code }
          Get-ChildItem dist\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: venitsupply-setup-${{ steps.ver.outputs.version }}
          path: venitsupply/dist/venitsupply-setup-*.exe
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/venitsupply-v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: venitsupply-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: พัสดุเวนิช (VENIT SUPPLY) ${{ steps.ver.outputs.version }}
          body_path: venitsupply/installer/release-notes.md
          files: venitsupply/dist/venitsupply-setup-*.exe
