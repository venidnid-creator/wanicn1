# SPDX-License-Identifier: GPL-3.0-or-later
# WANICNSURVEY for Windows: one Thai installer with the start screen,
# WANICNSURVEY CAD (IngeCAD) and WANICNSURVEY 3D (IngeTrazo).
#
# Mirrors the upstream build-windows.yml of both projects:
#  1. converters: IngeCAD's patched LibreDWG, cross-built on Linux with mingw
#  2. windows:    PyInstaller bundles of cad/, 3d/ and launcher/, smoke-tested,
#                 then wrapped by Inno Setup (Thai).
# Run it from the Actions tab ("Run workflow"), or push a tag v2026.10.28.
name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown by the installer (e.g. 2026.10.28)"
        required: false
        default: ""
      release:
        description: "Publish a GitHub Release with the installer"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  converters:
    name: LibreDWG for win64 (IngeCAD patch)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 make curl
      - name: Cross-build the patched converters
        working-directory: cad
        run: tools/libredwg-patches/build-vendor-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libredwg-win64
          path: cad/vendor/libredwg/win64/*.exe
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installer
    needs: converters
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python dependencies (both programs)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.2 numpy "ezdxf>=1.4.4" "manifold3d>=3.5.3" Pillow pyproj
          pip install "openskp @ git+https://github.com/iamahsanmehmood/openskp@291700bc213655a00461838de71e5f206311e619#subdirectory=packages/python"
          # PyInstaller with a bootloader compiled here (fewer antivirus
          # false alarms), exactly as upstream does it.
          pip download --no-binary pyinstaller --no-deps pyinstaller -d "$RUNNER_TEMP/pyi"
          PYI_SRC="$(python -c "import glob, os, tarfile; d = os.path.join(os.environ['RUNNER_TEMP'], 'pyi'); t = tarfile.open(glob.glob(os.path.join(d, 'pyinstaller-*.tar.gz'))[0]); t.extractall(d, filter='data'); print(os.path.join(d, t.getnames()[0].split('/')[0]))")"
          PYI_SRC="$(cygpath -u "$PYI_SRC")"
          rm -f "$PYI_SRC"/PyInstaller/bootloader/Windows-64bit-intel/*.exe
          (cd "$PYI_SRC/bootloader" && python ./waf all --target-arch=64bit)
          pip install "$PYI_SRC"
          python -c "import PyInstaller, openskp; print('PyInstaller', PyInstaller.__version__)"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 3D native engine (Rust)
        shell: bash
        run: |
          pip install maturin
          maturin build --release -m 3d/rust/ingetrazo_core/Cargo.toml -o "$RUNNER_TEMP/wheels"
          pip install "$RUNNER_TEMP"/wheels/ingetrazo_core-*.whl

      - name: Tests of WANIC extensions
        shell: bash
        working-directory: 3d
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          set +e
          python -m pytest -q -rfE --tb=line -p no:cacheprovider tests/test_wanic_takeoff.py tests/test_wanic_profiles.py tests/test_wanic_building.py tests/test_wanic_quantities.py tests/test_wanic_buttons.py tests/test_bim.py > "$RUNNER_TEMP/pt.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/pt.txt"
          if [ $code -ne 0 ]; then
            grep -E "Error|error|assert|FAILED|ERROR|\.py:[0-9]+" "$RUNNER_TEMP/pt.txt" | grep -v "^ *$" | tail -9 | sed 's/^/::error::/'
            exit $code
          fi
          set -e
          python -c "from core.extensions import discover_plugins; p, e = discover_plugins(); print([x.stem for x in p], e); assert all(any(x.stem == s and x.setup for x in p) for s in ('wanic_takeoff', 'wanic_profiles', 'wanic_building')); assert not [x for x in e if x.stem.startswith('wanic')]"

      - uses: actions/download-artifact@v4
        with:
          name: libredwg-win64
          path: cad/vendor/libredwg/bin

      - name: DWG reader for 3D (LibreDWG win64 release)
        shell: bash
        run: |
          set -e
          V=0.14.8597
          SHA=7fee5c67c4f451f0542c0d6a3b12e91e99b15faf363fbf8b98ad84bac17ddfa2
          curl -fsSL -o "$RUNNER_TEMP/ldwg.zip" \
            "https://github.com/LibreDWG/libredwg/releases/download/$V/libredwg-$V-win64.zip"
          echo "$SHA  $RUNNER_TEMP/ldwg.zip" | sha256sum -c -
          mkdir -p 3d/vendor/libredwg/bin
          unzip -j -o "$RUNNER_TEMP/ldwg.zip" dwg2dxf.exe libredwg-0.dll libiconv-2.dll -d 3d/vendor/libredwg/bin

      - name: Freeze WANICNSURVEY CAD
        shell: bash
        working-directory: cad
        run: pyinstaller --noconfirm --distpath ../dist --workpath ../build/cad packaging/ingecad.spec

      - name: Freeze WANICNSURVEY 3D
        shell: bash
        working-directory: 3d
        run: pyinstaller --noconfirm --distpath ../dist --workpath ../build/3d ingetrazo.spec

      - name: Freeze the start screen
        shell: bash
        run: pyinstaller --noconfirm --distpath dist --workpath build/launcher launcher/launcher.spec

      - name: Smoke test of the bundles
        shell: bash
        run: |
          test -f dist/launcher/wanicnsurvey.exe
          test -f dist/ingecad/ingecad.exe
          test -f dist/ingetrazo/ingetrazo.exe
          test -f dist/ingecad/_internal/i18n/th/ui.json
          test -f dist/ingetrazo/_internal/i18n/th.json
          find dist/ingecad -name dwg2dxf.exe | grep -q .
          ./dist/ingecad/ingecad.exe --check
          ./dist/ingetrazo/ingetrazo.exe --check
          du -sh dist/*

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"
          else V="$(date +%Y.%m.%d)"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Inno Setup 6.5+ (Thai)
        shell: pwsh
        # The runner ships an older Inno Setup; Thai.isl needs 6.5 or newer.
        run: choco upgrade innosetup -y --no-progress

      - name: Installer
        shell: pwsh
        run: |
          $all = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                 Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending
          $all | ForEach-Object { Write-Host "$($_.FullName)  $($_.VersionInfo.FileVersion)" }
          $iscc = $all[0].FullName
          $out = & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\wanicnsurvey.iss 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            # Errors as annotations, so they read without downloading the log.
            # GitHub shows 10 annotations per step: sizes first, then the end
            # of the compiler output without the per-file "Compressing" lines.
            $sizes = Get-ChildItem dist -Directory | ForEach-Object {
              "$($_.Name)=" + [math]::Round(((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)) + "MB" }
            Write-Host "::error::bundle sizes: $($sizes -join ', ')"
            $out | Where-Object { "$_" -notmatch 'Compressing:' } | Select-Object -Last 8 | ForEach-Object { Write-Host "::error::$_" }
            exit $code
          }
          Get-ChildItem dist\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: wanicnsurvey-setup-${{ steps.ver.outputs.version }}
          path: dist/wanicnsurvey-setup-*.exe
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WANICNSURVEY ${{ steps.ver.outputs.version }}
          body_path: installer/release-notes.md
          files: dist/wanicnsurvey-setup-*.exe
